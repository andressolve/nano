<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080b0f" />
  <meta name="description" content="Read The Count of Monte Cristo: Expanded Edition — a 55-page cinematic illustrated novel about betrayal, imprisonment, friendship, escape, and the first choice made with a new fortune." />
  <title>The Count of Monte Cristo — Expanded Edition</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #080b0f;
      --ink-raised: #11161c;
      --paper: #efe5d0;
      --paper-soft: rgba(239, 229, 208, 0.68);
      --paper-faint: rgba(239, 229, 208, 0.42);
      --gold: #c8a267;
      --gold-soft: rgba(200, 162, 103, 0.14);
      --oxblood: #78342f;
      --sea: #314a58;
      --line: rgba(239, 229, 208, 0.14);
      --shadow: rgba(0, 0, 0, 0.76);
      --bar-height: 62px;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: var(--ink);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      overflow-x: hidden;
      color: var(--paper);
      background:
        radial-gradient(circle at 50% 18%, rgba(102, 76, 48, 0.19), transparent 34rem),
        radial-gradient(circle at 14% 72%, rgba(49, 74, 88, 0.09), transparent 28rem),
        linear-gradient(145deg, rgba(120, 52, 47, 0.07), transparent 42%),
        var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    button, a { font: inherit; }

    button:focus-visible,
    a:focus-visible,
    [tabindex]:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .progress-track {
      position: fixed;
      z-index: 140;
      inset: 0 0 auto;
      height: 3px;
      background: rgba(255, 255, 255, 0.035);
    }

    .progress {
      display: block;
      width: calc(100% / 55);
      height: 100%;
      background: linear-gradient(90deg, var(--sea), var(--oxblood), var(--gold));
      box-shadow: 0 0 15px rgba(200, 162, 103, 0.3);
      transition: width 220ms ease;
    }

    .topbar {
      position: fixed;
      z-index: 120;
      inset: 3px 0 auto;
      display: grid;
      grid-template-columns: 1fr minmax(0, auto) 1fr;
      align-items: center;
      gap: 16px;
      min-height: var(--bar-height);
      padding: 8px max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
      background: linear-gradient(180deg, rgba(8, 11, 15, 0.98), rgba(8, 11, 15, 0.78) 72%, transparent);
      pointer-events: none;
    }

    .topbar > * { pointer-events: auto; }

    .home {
      justify-self: start;
      color: var(--paper-faint);
      text-decoration: none;
      font: 700 10px/1.2 system-ui, sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      transition: color 150ms ease;
    }

    .home:hover { color: var(--paper); }

    .book-id {
      max-width: min(48vw, 560px);
      overflow: hidden;
      text-align: center;
    }

    .book-id strong,
    .book-id span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .book-id strong {
      font-size: 13px;
      font-weight: normal;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .book-id span {
      margin-top: 3px;
      color: rgba(200, 162, 103, 0.8);
      font: 700 9px/1.2 system-ui, sans-serif;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .actions {
      display: flex;
      justify-self: end;
      align-items: center;
      gap: 4px;
    }

    .tool {
      display: inline-flex;
      min-height: 34px;
      align-items: center;
      gap: 6px;
      border: 0;
      border-radius: 999px;
      padding: 7px 9px;
      color: var(--paper-faint);
      background: transparent;
      cursor: pointer;
      font: 700 10px/1 system-ui, sans-serif;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      transition: color 150ms ease, background 150ms ease;
    }

    .tool:hover {
      color: var(--paper);
      background: rgba(239, 229, 208, 0.07);
    }

    .tool[aria-pressed="true"] {
      color: var(--paper);
      background: var(--gold-soft);
    }

    .tool-icon {
      min-width: 16px;
      color: var(--gold);
      font-size: 15px;
      line-height: 1;
      text-align: center;
    }

    main {
      display: grid;
      min-height: 100vh;
      min-height: 100dvh;
      place-items: center;
      padding: calc(var(--bar-height) + 8px) 78px 26px;
    }

    .stage {
      width: min(94vw, calc((100vh - 128px) * 2 / 3), 1024px);
      width: min(94vw, calc((100dvh - 128px) * 2 / 3), 1024px);
      min-width: 0;
    }

    .page-frame {
      position: relative;
      width: 100%;
      overflow: hidden;
      aspect-ratio: 2 / 3;
      border: 1px solid rgba(200, 162, 103, 0.2);
      border-radius: 3px;
      background: #05070a;
      box-shadow:
        0 26px 82px var(--shadow),
        0 0 0 1px rgba(0, 0, 0, 0.76);
      opacity: 1;
      transition: opacity 150ms ease, transform 150ms ease;
    }

    .page-frame.changing {
      opacity: 0;
      transform: translateY(3px);
    }

    .page-frame img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .tap-zone {
      position: absolute;
      z-index: 2;
      inset-block: 0;
      border: 0;
      padding: 0;
      background: transparent;
    }

    .tap-zone.prev-zone {
      left: 0;
      width: 30%;
      cursor: w-resize;
    }

    .tap-zone.zoom-zone {
      left: 30%;
      width: 40%;
      cursor: zoom-in;
    }

    .tap-zone.next-zone {
      right: 0;
      width: 30%;
      cursor: e-resize;
    }

    .folio {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      min-height: 34px;
      padding: 9px 3px 0;
      color: var(--paper-faint);
      font: 700 9px/1.3 system-ui, sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .folio-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .folio-counter { color: rgba(200, 162, 103, 0.78); }

    .nav {
      position: fixed;
      z-index: 90;
      top: 50%;
      display: grid;
      width: 50px;
      height: 50px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--paper);
      background: rgba(13, 17, 22, 0.78);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.38);
      cursor: pointer;
      font: 23px/1 system-ui, sans-serif;
      transform: translateY(-50%);
      transition: background 150ms ease, border-color 150ms ease, opacity 150ms ease, transform 150ms ease;
      backdrop-filter: blur(8px);
    }

    .nav:hover:not(:disabled) {
      border-color: rgba(200, 162, 103, 0.58);
      background: rgba(120, 52, 47, 0.5);
      transform: translateY(-50%) scale(1.04);
    }

    .nav:disabled {
      opacity: 0.13;
      cursor: default;
    }

    .nav.prev { left: 16px; }
    .nav.next { right: 16px; }

    dialog {
      color: var(--paper);
      background: var(--ink-raised);
    }

    dialog::backdrop {
      background: rgba(2, 4, 7, 0.82);
      backdrop-filter: blur(5px);
    }

    .contents-dialog {
      width: min(420px, calc(100vw - 22px));
      max-width: none;
      height: 100vh;
      height: 100dvh;
      max-height: none;
      margin: 0 0 0 auto;
      border: 0;
      border-left: 1px solid rgba(200, 162, 103, 0.22);
      padding: 0;
      box-shadow: -28px 0 90px rgba(0, 0, 0, 0.58);
    }

    .contents-shell {
      display: grid;
      height: 100%;
      grid-template-rows: auto 1fr;
    }

    .contents-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      padding: 26px 24px 18px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(200, 162, 103, 0.055), transparent);
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--gold);
      font: 750 9px/1.3 system-ui, sans-serif;
      letter-spacing: 0.17em;
      text-transform: uppercase;
    }

    .contents-head h2 {
      margin: 0;
      font-size: 29px;
      font-weight: normal;
      line-height: 1.05;
    }

    .icon-button {
      display: grid;
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--paper);
      background: rgba(0, 0, 0, 0.16);
      cursor: pointer;
      font: 18px/1 system-ui, sans-serif;
      transition: background 150ms ease, border-color 150ms ease;
    }

    .icon-button:hover {
      border-color: rgba(200, 162, 103, 0.5);
      background: var(--gold-soft);
    }

    .contents-list {
      overflow: auto;
      padding: 12px 14px 40px;
      overscroll-behavior: contain;
    }

    .bookmarks-section {
      margin: 4px 0 22px;
      padding: 10px 0 20px;
      border-bottom: 1px solid var(--line);
    }

    .bookmarks-section[hidden] { display: none; }

    .bookmarks-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin: 0 10px 8px;
    }

    .bookmarks-head h3 {
      margin: 0;
      color: var(--gold);
      font: 750 9px/1.3 system-ui, sans-serif;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .bookmark-count {
      color: var(--paper-faint);
      font: 700 9px/1.2 system-ui, sans-serif;
    }

    .movement {
      margin: 17px 0 25px;
    }

    .movement h3 {
      margin: 0 10px 8px;
      color: rgba(200, 162, 103, 0.84);
      font: 750 9px/1.3 system-ui, sans-serif;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .contents-page {
      display: grid;
      width: 100%;
      grid-template-columns: 31px minmax(0, 1fr) 18px;
      gap: 10px;
      align-items: baseline;
      border: 0;
      border-radius: 4px;
      padding: 9px 10px;
      color: var(--paper-soft);
      background: transparent;
      cursor: pointer;
      text-align: left;
      transition: color 130ms ease, background 130ms ease;
    }

    .contents-page:hover {
      color: var(--paper);
      background: rgba(239, 229, 208, 0.055);
    }

    .contents-page[aria-current="page"] {
      color: var(--paper);
      background: linear-gradient(90deg, rgba(120, 52, 47, 0.28), rgba(200, 162, 103, 0.08));
      box-shadow: inset 2px 0 var(--gold);
    }

    .contents-number {
      color: var(--paper-faint);
      font: 700 9px/1.2 system-ui, sans-serif;
      letter-spacing: 0.08em;
    }

    .contents-title {
      font-size: 14px;
      line-height: 1.3;
    }

    .bookmark-mark {
      color: var(--gold);
      font: 13px/1 system-ui, sans-serif;
      text-align: center;
    }

    .zoom-dialog {
      width: 100vw;
      max-width: none;
      height: 100vh;
      height: 100dvh;
      max-height: none;
      margin: 0;
      border: 0;
      padding: 0;
      overflow: hidden;
      background: rgba(5, 7, 10, 0.985);
    }

    .zoom-shell {
      display: grid;
      height: 100%;
      grid-template-rows: auto 1fr;
    }

    .zoom-toolbar {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      min-height: 62px;
      padding: 10px max(14px, env(safe-area-inset-right)) 10px max(14px, env(safe-area-inset-left));
      border-bottom: 1px solid var(--line);
      background: rgba(10, 13, 17, 0.96);
      box-shadow: 0 10px 36px rgba(0, 0, 0, 0.36);
    }

    .zoom-context {
      min-width: 0;
    }

    .zoom-context strong,
    .zoom-context span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .zoom-context strong {
      color: var(--paper);
      font-size: 13px;
      font-weight: normal;
    }

    .zoom-context span {
      margin-top: 3px;
      color: var(--paper-faint);
      font: 700 9px/1.2 system-ui, sans-serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .zoom-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .zoom-controls { justify-self: end; }

    .zoom-page-nav { z-index: 4; }

    .zoom-button,
    .zoom-readout {
      display: grid;
      height: 36px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--paper-soft);
      background: rgba(239, 229, 208, 0.035);
      font: 750 11px/1 system-ui, sans-serif;
    }

    .zoom-button {
      min-width: 36px;
      padding: 0 11px;
      cursor: pointer;
    }

    .zoom-button:hover:not(:disabled) {
      color: var(--paper);
      border-color: rgba(200, 162, 103, 0.5);
      background: var(--gold-soft);
    }

    .zoom-button[aria-pressed="true"] {
      color: var(--gold);
      border-color: rgba(200, 162, 103, 0.48);
      background: var(--gold-soft);
    }

    .zoom-button:disabled { opacity: 0.25; }

    .zoom-readout {
      min-width: 58px;
      border-color: transparent;
      color: rgba(200, 162, 103, 0.9);
      background: transparent;
    }

    .zoom-viewport {
      position: relative;
      overflow: auto;
      min-height: 0;
      overscroll-behavior: contain;
      scrollbar-color: rgba(200, 162, 103, 0.38) rgba(255, 255, 255, 0.025);
      touch-action: pan-x pan-y pinch-zoom;
    }

    .zoom-viewport.dragging { cursor: grabbing; }

    .zoom-canvas {
      display: grid;
      width: max-content;
      min-width: 100%;
      min-height: 100%;
      place-items: start center;
      padding: 26px;
    }

    .zoom-image {
      display: block;
      width: 600px;
      max-width: none;
      height: auto;
      border: 1px solid rgba(200, 162, 103, 0.16);
      box-shadow: 0 24px 88px rgba(0, 0, 0, 0.82);
      user-select: none;
      -webkit-user-drag: none;
    }

    .reader-status {
      position: fixed;
      z-index: 170;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      max-width: calc(100vw - 32px);
      padding: 9px 13px;
      border: 1px solid rgba(200, 162, 103, 0.22);
      border-radius: 999px;
      color: var(--paper-soft);
      background: rgba(13, 17, 22, 0.94);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      font: 700 10px/1.2 system-ui, sans-serif;
      letter-spacing: 0.06em;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 8px);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .reader-status.visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 860px) {
      .topbar { gap: 6px; padding-inline: 10px; }
      .home-label,
      .tool-label { display: none; }
      .home { font-size: 15px; letter-spacing: 0; }
      .book-id { max-width: 44vw; }
      .book-id strong { font-size: 10px; }
      .book-id span { font-size: 8px; }
      .tool { width: 34px; justify-content: center; padding-inline: 0; }
      .tool-icon { font-size: 16px; }
      main { padding: calc(var(--bar-height) + 2px) 8px 70px; }
      .stage { width: min(100%, calc((100dvh - 140px) * 2 / 3)); }
      .nav {
        top: auto;
        bottom: max(12px, env(safe-area-inset-bottom));
        width: 46px;
        height: 46px;
        transform: none;
        background: rgba(13, 17, 22, 0.94);
      }
      .nav:hover:not(:disabled) { transform: scale(1.04); }
      .nav.prev { left: calc(50% - 58px); }
      .nav.next { right: calc(50% - 58px); }
      .folio { padding-inline: 5px; }
      .zoom-controls { gap: 3px; }
      .zoom-button { padding-inline: 9px; }
      .zoom-context strong { font-size: 11px; }
      .zoom-readout { min-width: 50px; }
      .zoom-canvas { padding: 18px; }
    }

    @media (max-width: 440px) {
      .book-id { max-width: 40vw; }
      .book-id strong { letter-spacing: 0.09em; }
      .actions { gap: 0; }
      .folio { grid-template-columns: minmax(0, 1fr) auto; }
      .contents-dialog { width: 100vw; }
      .contents-head { padding-inline: 20px; }
      .zoom-toolbar { min-height: 58px; gap: 6px; padding-inline: 9px; }
      .zoom-context span { display: none; }
      .zoom-button { min-width: 32px; height: 34px; padding-inline: 8px; }
      .zoom-readout { min-width: 44px; height: 34px; font-size: 10px; }
      .zoom-canvas { padding: 12px; }
    }

    @media (max-height: 620px) and (orientation: landscape) {
      :root { --bar-height: 52px; }
      main { padding-block: 52px 18px; }
      .stage { width: min(88vw, calc((100dvh - 84px) * 2 / 3), 1024px); }
      .folio { min-height: 24px; padding-top: 5px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="progress-track" aria-hidden="true"><span class="progress" id="progress"></span></div>

  <header class="topbar">
    <a class="home" href="../index.html" aria-label="Back to the story library">
      <span aria-hidden="true">←</span> <span class="home-label">Stories</span>
    </a>

    <div class="book-id">
      <strong>The Count of Monte Cristo</strong>
      <span id="movementLabel">Expanded edition · The Homecoming</span>
    </div>

    <div class="actions">
      <button class="tool" id="contentsButton" type="button" aria-label="Open contents" aria-keyshortcuts="C">
        <span class="tool-icon" aria-hidden="true">☰</span><span class="tool-label">Contents</span>
      </button>
      <button class="tool" id="zoomButton" type="button" aria-label="Zoom current page" aria-keyshortcuts="Z">
        <span class="tool-icon" aria-hidden="true">＋</span><span class="tool-label">Zoom</span>
      </button>
      <button class="tool" id="bookmarkButton" type="button" aria-label="Bookmark current page" aria-keyshortcuts="B" aria-pressed="false">
        <span class="tool-icon" id="bookmarkIcon" aria-hidden="true">☆</span><span class="tool-label">Bookmark</span>
      </button>
      <button class="tool" id="fullscreenButton" type="button" aria-label="Enter fullscreen" aria-keyshortcuts="F">
        <span class="tool-icon" id="fullscreenIcon" aria-hidden="true">⛶</span><span class="tool-label" id="fullscreenLabel">Full screen</span>
      </button>
    </div>
  </header>

  <main>
    <section class="stage" aria-label="Expanded edition reader" aria-live="polite">
      <div class="page-frame" id="pageFrame">
        <img id="pageImage" src="pages/page-01.png" alt="The Count of Monte Cristo: Expanded Edition — Page 1: Bring Her Home" />
        <button class="tap-zone prev-zone" id="tapPrev" type="button" aria-label="Previous page"></button>
        <button class="tap-zone zoom-zone" id="tapZoom" type="button" aria-label="Zoom current page"></button>
        <button class="tap-zone next-zone" id="tapNext" type="button" aria-label="Next page"></button>
      </div>

      <div class="folio">
        <span class="folio-title" id="pageTitle">Bring Her Home</span>
        <span class="folio-counter" id="counter">Page 1 of 55</span>
      </div>
    </section>
  </main>

  <button class="nav prev" id="prev" type="button" aria-label="Previous page">←</button>
  <button class="nav next" id="next" type="button" aria-label="Next page">→</button>

  <dialog class="contents-dialog" id="contentsDialog" aria-labelledby="contentsTitle">
    <div class="contents-shell">
      <header class="contents-head">
        <div>
          <p class="eyebrow">Expanded edition · 55 pages</p>
          <h2 id="contentsTitle">Contents</h2>
        </div>
        <button class="icon-button" id="closeContents" type="button" aria-label="Close contents">×</button>
      </header>
      <nav class="contents-list" id="contentsList" aria-label="Bookmarks, story movements, and pages">
        <section class="bookmarks-section" id="bookmarksSection" hidden>
          <div class="bookmarks-head">
            <h3>Bookmarks</h3>
            <span class="bookmark-count" id="bookmarkCount"></span>
          </div>
          <div id="bookmarksList"></div>
        </section>
        <div id="movementList"></div>
      </nav>
    </div>
  </dialog>

  <dialog class="zoom-dialog" id="zoomDialog" aria-labelledby="zoomTitle">
    <div class="zoom-shell">
      <header class="zoom-toolbar">
        <div class="zoom-context">
          <strong id="zoomTitle">Bring Her Home</strong>
          <span id="zoomPageLabel">Page 1 of 55</span>
        </div>

        <div class="zoom-controls" aria-label="Zoom controls">
          <button class="zoom-button" id="zoomOut" type="button" aria-label="Zoom out">−</button>
          <output class="zoom-readout" id="zoomReadout" aria-live="polite">Fit</output>
          <button class="zoom-button" id="zoomIn" type="button" aria-label="Zoom in">+</button>
          <button class="zoom-button" id="zoomFit" type="button" aria-label="Fit page">Fit</button>
          <button class="zoom-button" id="zoomBookmark" type="button" aria-label="Bookmark current page" aria-pressed="false"><span id="zoomBookmarkIcon" aria-hidden="true">☆</span></button>
          <button class="zoom-button" id="closeZoom" type="button" aria-label="Close zoom">×</button>
        </div>
      </header>

      <button class="nav prev zoom-page-nav" id="zoomPrev" type="button" aria-label="Previous page while zoomed">←</button>
      <button class="nav next zoom-page-nav" id="zoomNext" type="button" aria-label="Next page while zoomed">→</button>

      <div class="zoom-viewport" id="zoomViewport" tabindex="0" aria-label="Zoomed page. Scroll to inspect the page; use plus and minus to change magnification.">
        <div class="zoom-canvas">
          <img class="zoom-image" id="zoomImage" src="pages/page-01.png" alt="Enlarged view of Page 1: Bring Her Home" />
        </div>
      </div>
    </div>
  </dialog>

  <div class="reader-status" id="readerStatus" role="status" aria-live="polite"></div>

  <script>
    const titles = [
      "Bring Her Home",
      "Captain at Nineteen",
      "The Empty Cupboard",
      "The Catalans",
      "Tomorrow",
      "What Each Man Wanted",
      "The Table",
      "The Denunciation",
      "The Feast",
      "The Arrest",
      "After the Door Closes",
      "Two Betrothals",
      "A Dying Captain's Word",
      "Innocent",
      "Noirtier",
      "The Choice",
      "The Black Island",
      "Prisoner Thirty-Four",
      "The Petition",
      "Outside the Walls",
      "The Years Without an Answer",
      "The Sound",
      "Beneath the Stone",
      "Prisoner Twenty-Seven",
      "North, Not East",
      "We",
      "Italian First",
      "The School Beneath the Prison",
      "A New Mind",
      "Tell Me the Story",
      "Three Suspects",
      "Noirtier's Son",
      "What Not to Destroy",
      "Invisible Ink",
      "The Heir",
      "The Last Lesson",
      "After the Voice",
      "The Exchange",
      "First Breath",
      "The Jeune-Amélie",
      "A Place Aboard",
      "The Split Rock",
      "Monte Cristo",
      "A Man with More Than One Name",
      "Abbé Busoni: The Dead",
      "Abbé Busoni: The Confession",
      "Abbé Busoni: Mercédès",
      "Abbé Busoni: The Living",
      "Lord Wilmore",
      "Morrel & Son",
      "Thomson & French",
      "The Letter to Julie",
      "The Red Purse",
      "Eleven O'Clock",
      "The Pharaon"
    ];

    const movements = [
      { title: "I · The Homecoming", start: 1, end: 5 },
      { title: "II · Three Men at a Table", start: 6, end: 11 },
      { title: "III · The Prosecutor's Choice", start: 12, end: 17 },
      { title: "IV · The Man Without a Name", start: 18, end: 22 },
      { title: "V · The Voice in the Wall", start: 23, end: 34 },
      { title: "VI · The Dead Man Leaves", start: 35, end: 43 },
      { title: "VII · The Lost Years", start: 44, end: 49 },
      { title: "VIII · The First Gift", start: 50, end: 55 }
    ];

    const STORAGE_KEY = "nano:monte-cristo-expanded:page";
    const BOOKMARKS_KEY = "nano:monte-cristo-expanded:bookmarks";
    const zoomLevels = [1, 1.25, 1.5, 2, 2.5, 3];
    const DEFAULT_ZOOM_INDEX = 2;
    const pageFrame = document.getElementById("pageFrame");
    const pageImage = document.getElementById("pageImage");
    const pageTitle = document.getElementById("pageTitle");
    const counter = document.getElementById("counter");
    const movementLabel = document.getElementById("movementLabel");
    const progress = document.getElementById("progress");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");
    const contentsButton = document.getElementById("contentsButton");
    const contentsDialog = document.getElementById("contentsDialog");
    const contentsList = document.getElementById("contentsList");
    const movementList = document.getElementById("movementList");
    const bookmarksSection = document.getElementById("bookmarksSection");
    const bookmarksList = document.getElementById("bookmarksList");
    const bookmarkCount = document.getElementById("bookmarkCount");
    const bookmarkButton = document.getElementById("bookmarkButton");
    const bookmarkIcon = document.getElementById("bookmarkIcon");
    const zoomButton = document.getElementById("zoomButton");
    const zoomDialog = document.getElementById("zoomDialog");
    const zoomViewport = document.getElementById("zoomViewport");
    const zoomImage = document.getElementById("zoomImage");
    const zoomTitle = document.getElementById("zoomTitle");
    const zoomPageLabel = document.getElementById("zoomPageLabel");
    const zoomReadout = document.getElementById("zoomReadout");
    const zoomBookmark = document.getElementById("zoomBookmark");
    const zoomBookmarkIcon = document.getElementById("zoomBookmarkIcon");
    const zoomOut = document.getElementById("zoomOut");
    const zoomIn = document.getElementById("zoomIn");
    const zoomPrev = document.getElementById("zoomPrev");
    const zoomNext = document.getElementById("zoomNext");
    const fullscreenButton = document.getElementById("fullscreenButton");
    const readerStatus = document.getElementById("readerStatus");
    let current = initialIndex();
    let bookmarks = loadBookmarks();
    let zoomIndex = 0;
    let transitionTimer;
    let statusTimer;

    function clampIndex(index) {
      return Math.max(0, Math.min(titles.length - 1, index));
    }

    function indexFromHash() {
      const match = location.hash.match(/^#(?:page-)?(\d+)$/);
      return match ? clampIndex(Number(match[1]) - 1) : null;
    }

    function savedIndex() {
      try {
        const saved = Number(localStorage.getItem(STORAGE_KEY));
        return Number.isInteger(saved) ? clampIndex(saved) : 0;
      } catch (_) {
        return 0;
      }
    }

    function initialIndex() {
      return indexFromHash() ?? savedIndex();
    }

    function loadBookmarks() {
      try {
        const saved = JSON.parse(localStorage.getItem(BOOKMARKS_KEY) || "[]");
        if (!Array.isArray(saved)) return new Set();
        return new Set(saved.filter((index) => Number.isInteger(index) && index >= 0 && index < titles.length));
      } catch (_) {
        return new Set();
      }
    }

    function saveBookmarks() {
      try {
        localStorage.setItem(BOOKMARKS_KEY, JSON.stringify([...bookmarks].sort((a, b) => a - b)));
      } catch (_) {
        // Bookmarks remain available for this visit when storage is unavailable.
      }
    }

    function fileFor(index) {
      return `pages/page-${String(index + 1).padStart(2, "0")}.png`;
    }

    function movementFor(index) {
      const pageNumber = index + 1;
      return movements.find((movement) => pageNumber >= movement.start && pageNumber <= movement.end);
    }

    function updateUrl() {
      const params = new URLSearchParams(location.search);
      params.delete("set");
      const query = params.toString();
      const target = `${location.pathname}${query ? `?${query}` : ""}#page-${current + 1}`;
      if (`${location.pathname}${location.search}${location.hash}` !== target) {
        history.replaceState(null, "", target);
      }
    }

    function savePosition() {
      try {
        localStorage.setItem(STORAGE_KEY, String(current));
      } catch (_) {
        // The URL still preserves the exact reading position when storage is unavailable.
      }
    }

    function preload(index) {
      [index - 1, index + 1].forEach((candidate) => {
        if (candidate < 0 || candidate >= titles.length) return;
        const preloadImage = new Image();
        preloadImage.src = fileFor(candidate);
      });
    }

    function updateContentsSelection() {
      contentsList.querySelectorAll(".contents-page").forEach((button) => {
        const index = Number(button.dataset.index);
        const isCurrent = index === current;
        if (isCurrent) button.setAttribute("aria-current", "page");
        else button.removeAttribute("aria-current");
        const mark = button.querySelector(".bookmark-mark");
        if (mark) mark.textContent = bookmarks.has(index) ? "★" : "";
      });
    }

    function updateBookmarkControls() {
      const bookmarked = bookmarks.has(current);
      const label = bookmarked ? "Remove bookmark from current page" : "Bookmark current page";
      bookmarkButton.setAttribute("aria-pressed", String(bookmarked));
      bookmarkButton.setAttribute("aria-label", label);
      bookmarkIcon.textContent = bookmarked ? "★" : "☆";
      zoomBookmark.setAttribute("aria-pressed", String(bookmarked));
      zoomBookmark.setAttribute("aria-label", label);
      zoomBookmarkIcon.textContent = bookmarked ? "★" : "☆";
    }

    function bookmarkButtonFor(index) {
      const pageNumber = index + 1;
      const button = document.createElement("button");
      button.className = "contents-page";
      button.type = "button";
      button.dataset.index = String(index);
      button.innerHTML = `<span class="contents-number">${String(pageNumber).padStart(2, "0")}</span><span class="contents-title">${titles[index]}</span><span class="bookmark-mark" aria-hidden="true">★</span>`;
      button.addEventListener("click", () => {
        contentsDialog.close();
        render(index);
      });
      return button;
    }

    function renderBookmarks() {
      const saved = [...bookmarks].sort((a, b) => a - b);
      bookmarksSection.hidden = saved.length === 0;
      bookmarkCount.textContent = `${saved.length} saved`;
      bookmarksList.replaceChildren(...saved.map(bookmarkButtonFor));
      updateContentsSelection();
    }

    function toggleBookmark() {
      const removing = bookmarks.has(current);
      if (removing) bookmarks.delete(current);
      else bookmarks.add(current);
      saveBookmarks();
      renderBookmarks();
      updateBookmarkControls();
      showStatus(`${removing ? "Bookmark removed from" : "Bookmarked"} Page ${current + 1}`);
    }

    function updateZoomPage(resetScroll = false) {
      const pageNumber = current + 1;
      zoomImage.src = fileFor(current);
      zoomImage.alt = `Enlarged view of Page ${pageNumber}: ${titles[current]}`;
      zoomTitle.textContent = titles[current];
      zoomPageLabel.textContent = `Page ${pageNumber} of ${titles.length}`;
      zoomPrev.disabled = current === 0;
      zoomNext.disabled = current === titles.length - 1;
      updateBookmarkControls();
      if (resetScroll) zoomViewport.scrollTo({ top: 0, left: 0, behavior: "auto" });
    }

    function render(index, immediate = false) {
      clearTimeout(transitionTimer);
      current = clampIndex(index);
      if (!immediate) pageFrame.classList.add("changing");

      const draw = () => {
        const pageNumber = current + 1;
        const movement = movementFor(current);
        pageImage.src = fileFor(current);
        pageImage.alt = `The Count of Monte Cristo: Expanded Edition — Page ${pageNumber}: ${titles[current]}`;
        pageTitle.textContent = titles[current];
        counter.textContent = `Page ${pageNumber} of ${titles.length}`;
        movementLabel.textContent = `Expanded edition · ${movement.title.replace(/^\w+ · /, "")}`;
        progress.style.width = `${(pageNumber / titles.length) * 100}%`;
        prev.disabled = current === 0;
        next.disabled = current === titles.length - 1;
        updateUrl();
        savePosition();
        updateContentsSelection();
        updateBookmarkControls();
        if (zoomDialog.open) updateZoomPage(true);
        preload(current);
        requestAnimationFrame(() => pageFrame.classList.remove("changing"));
      };

      if (immediate) draw();
      else transitionTimer = setTimeout(draw, 110);
    }

    function goPrevious() {
      if (current > 0) render(current - 1);
    }

    function goNext() {
      if (current < titles.length - 1) render(current + 1);
    }

    function buildContents() {
      const fragment = document.createDocumentFragment();
      movements.forEach((movement) => {
        const section = document.createElement("section");
        section.className = "movement";
        const heading = document.createElement("h3");
        heading.textContent = movement.title;
        section.appendChild(heading);

        for (let pageNumber = movement.start; pageNumber <= movement.end; pageNumber += 1) {
          const index = pageNumber - 1;
          const button = document.createElement("button");
          button.className = "contents-page";
          button.type = "button";
          button.dataset.index = String(index);
          button.innerHTML = `<span class="contents-number">${String(pageNumber).padStart(2, "0")}</span><span class="contents-title">${titles[index]}</span><span class="bookmark-mark" aria-hidden="true"></span>`;
          button.addEventListener("click", () => {
            contentsDialog.close();
            render(index);
          });
          section.appendChild(button);
        }
        fragment.appendChild(section);
      });
      movementList.appendChild(fragment);
      renderBookmarks();
    }

    function openContents() {
      updateContentsSelection();
      contentsDialog.showModal();
      requestAnimationFrame(() => {
        contentsList.querySelector('[aria-current="page"]')?.scrollIntoView({ block: "center", behavior: "auto" });
      });
    }

    function baseZoomWidth() {
      const horizontalRoom = window.innerWidth - (window.innerWidth <= 440 ? 24 : 52);
      const verticalRoom = (window.innerHeight - 96) * (2 / 3);
      return Math.max(240, Math.min(1024, horizontalRoom, verticalRoom));
    }

    function applyZoom(index, preserveCenter = true) {
      const nextIndex = Math.max(0, Math.min(zoomLevels.length - 1, index));
      const centerX = zoomViewport.scrollWidth
        ? (zoomViewport.scrollLeft + zoomViewport.clientWidth / 2) / zoomViewport.scrollWidth
        : 0.5;
      const centerY = zoomViewport.scrollHeight
        ? (zoomViewport.scrollTop + zoomViewport.clientHeight / 2) / zoomViewport.scrollHeight
        : 0;

      zoomIndex = nextIndex;
      zoomImage.style.width = `${Math.round(baseZoomWidth() * zoomLevels[zoomIndex])}px`;
      zoomReadout.textContent = zoomIndex === 0 ? "Fit" : `${Math.round(zoomLevels[zoomIndex] * 100)}%`;
      zoomOut.disabled = zoomIndex === 0;
      zoomIn.disabled = zoomIndex === zoomLevels.length - 1;

      requestAnimationFrame(() => {
        if (!preserveCenter) {
          zoomViewport.scrollTo({
            top: 0,
            left: Math.max(0, (zoomViewport.scrollWidth - zoomViewport.clientWidth) / 2),
            behavior: "auto"
          });
          return;
        }
        if (zoomIndex === 0) {
          zoomViewport.scrollTo({ top: 0, left: 0, behavior: "auto" });
          return;
        }
        zoomViewport.scrollLeft = centerX * zoomViewport.scrollWidth - zoomViewport.clientWidth / 2;
        zoomViewport.scrollTop = centerY * zoomViewport.scrollHeight - zoomViewport.clientHeight / 2;
      });
    }

    function openZoom() {
      updateZoomPage(true);
      zoomDialog.showModal();
      applyZoom(DEFAULT_ZOOM_INDEX, false);
      zoomViewport.focus({ preventScroll: true });
    }

    function showStatus(message) {
      clearTimeout(statusTimer);
      readerStatus.textContent = message;
      readerStatus.classList.add("visible");
      statusTimer = setTimeout(() => readerStatus.classList.remove("visible"), 1800);
    }

    prev.addEventListener("click", goPrevious);
    next.addEventListener("click", goNext);
    document.getElementById("tapPrev").addEventListener("click", goPrevious);
    document.getElementById("tapNext").addEventListener("click", goNext);
    document.getElementById("tapZoom").addEventListener("click", openZoom);
    contentsButton.addEventListener("click", openContents);
    document.getElementById("closeContents").addEventListener("click", () => contentsDialog.close());
    zoomButton.addEventListener("click", openZoom);
    bookmarkButton.addEventListener("click", toggleBookmark);
    document.getElementById("closeZoom").addEventListener("click", () => zoomDialog.close());
    zoomOut.addEventListener("click", () => applyZoom(zoomIndex - 1));
    zoomIn.addEventListener("click", () => applyZoom(zoomIndex + 1));
    document.getElementById("zoomFit").addEventListener("click", () => applyZoom(0, false));
    zoomBookmark.addEventListener("click", toggleBookmark);
    zoomPrev.addEventListener("click", goPrevious);
    zoomNext.addEventListener("click", goNext);

    contentsDialog.addEventListener("click", (event) => {
      if (event.target === contentsDialog) contentsDialog.close();
    });

    zoomImage.addEventListener("dblclick", () => {
      applyZoom(zoomIndex === 0 ? 3 : 0, false);
    });

    let dragState = null;
    zoomViewport.addEventListener("pointerdown", (event) => {
      if (event.pointerType !== "mouse" || zoomIndex === 0) return;
      dragState = {
        id: event.pointerId,
        x: event.clientX,
        y: event.clientY,
        left: zoomViewport.scrollLeft,
        top: zoomViewport.scrollTop
      };
      zoomViewport.setPointerCapture(event.pointerId);
      zoomViewport.classList.add("dragging");
    });

    zoomViewport.addEventListener("pointermove", (event) => {
      if (!dragState || dragState.id !== event.pointerId) return;
      zoomViewport.scrollLeft = dragState.left - (event.clientX - dragState.x);
      zoomViewport.scrollTop = dragState.top - (event.clientY - dragState.y);
    });

    function endDrag(event) {
      if (!dragState || dragState.id !== event.pointerId) return;
      dragState = null;
      zoomViewport.classList.remove("dragging");
    }

    zoomViewport.addEventListener("pointerup", endDrag);
    zoomViewport.addEventListener("pointercancel", endDrag);

    document.addEventListener("keydown", (event) => {
      const targetIsControl = event.target.matches("button, a, input, select, textarea");

      if (zoomDialog.open) {
        if (event.key === "+" || event.key === "=") {
          event.preventDefault();
          applyZoom(zoomIndex + 1);
        } else if (event.key === "-") {
          event.preventDefault();
          applyZoom(zoomIndex - 1);
        } else if (event.key === "0") {
          event.preventDefault();
          applyZoom(0, false);
        } else if (event.key.toLowerCase() === "b") {
          event.preventDefault();
          toggleBookmark();
        }
        return;
      }

      if (contentsDialog.open || targetIsControl) return;
      if (event.key === "ArrowLeft" || event.key === "PageUp") {
        event.preventDefault();
        goPrevious();
      } else if (event.key === "ArrowRight" || event.key === "PageDown" || event.key === " ") {
        event.preventDefault();
        goNext();
      } else if (event.key === "Home") {
        event.preventDefault();
        render(0);
      } else if (event.key === "End") {
        event.preventDefault();
        render(titles.length - 1);
      } else if (event.key.toLowerCase() === "z") {
        openZoom();
      } else if (event.key.toLowerCase() === "c") {
        openContents();
      } else if (event.key.toLowerCase() === "f") {
        fullscreenButton.click();
      } else if (event.key.toLowerCase() === "b") {
        toggleBookmark();
      }
    });

    let touchStart = null;
    document.addEventListener("touchstart", (event) => {
      if (zoomDialog.open || contentsDialog.open) return;
      const touch = event.changedTouches[0];
      touchStart = { x: touch.clientX, y: touch.clientY };
    }, { passive: true });

    document.addEventListener("touchend", (event) => {
      if (!touchStart || zoomDialog.open || contentsDialog.open) return;
      const touch = event.changedTouches[0];
      const deltaX = touchStart.x - touch.clientX;
      const deltaY = touchStart.y - touch.clientY;
      touchStart = null;
      if (Math.abs(deltaX) < 52 || Math.abs(deltaX) < Math.abs(deltaY) * 1.25) return;
      if (deltaX > 0) goNext();
      else goPrevious();
    }, { passive: true });

    fullscreenButton.addEventListener("click", async () => {
      try {
        if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
        else await document.exitFullscreen();
      } catch (_) {
        showStatus("Full screen is not available in this browser");
      }
    });

    document.addEventListener("fullscreenchange", () => {
      const active = Boolean(document.fullscreenElement);
      fullscreenButton.setAttribute("aria-label", active ? "Exit fullscreen" : "Enter fullscreen");
      document.getElementById("fullscreenIcon").textContent = active ? "×" : "⛶";
      document.getElementById("fullscreenLabel").textContent = active ? "Exit full screen" : "Full screen";
    });

    window.addEventListener("resize", () => {
      if (zoomDialog.open) applyZoom(zoomIndex, false);
    });

    window.addEventListener("hashchange", () => {
      const hashIndex = indexFromHash();
      if (hashIndex !== null && hashIndex !== current) render(hashIndex, true);
    });

    buildContents();
    render(current, true);
  </script>
</body>
</html>
